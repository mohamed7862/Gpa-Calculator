<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA Calculator</title>
    <link rel="stylesheet" href="gpa.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="container">
        <!-- زرار اللغة في الأعلى يمين -->
        <button onclick="toggleLanguage()" id="lang-btn" style="float: right; padding: 6px 16px; background: #212529; color: white; font-size: 13px; font-weight: bold; border-radius: 20px; border: none; cursor: pointer; margin-bottom: 15px;">العربية</button>
        <div style="clear: both;"></div>

        <!-- عنوان التطبيق -->
        <h1 id="main-title" style="text-align: center; margin-top: 5px; margin-bottom: 20px;">GPA Calculator</h1>
        
        <div id="course-form">
            <!-- اختيار القسم داخل الفورم بنفس تصميم وتناسق الخانات -->
            <div style="margin-bottom: 15px;">
                <label for="dept-select" style="font-weight: bold; font-size: 13px; color: #495057; display: block; margin-bottom: 5px;">Department / القسم:</label>
                <select id="dept-select" onchange="changeDepartment(this.value)" style="width: 100%; padding: 10px; border-radius: 8px; background: #f8f9fa; color: #212529; border: 1px solid #ced4da; font-weight: bold; font-size: 14px; outline: none; cursor: pointer;">
                    <option value="CS">💻 Computer Science (علوم حاسب)</option>
                    <option value="AI">🤖 Artificial Intelligence (الذكاء الاصطناعي)</option>
                    <option value="CYBER">🛡️ Cyber Security (الأمن السيبراني)</option>
                </select>
            </div>

            <div class="form-group">
                <input type="text" id="subject" placeholder="Subject Name" list="subjects-list" required>
                <datalist id="subjects-list"></datalist>

                <select id="grade">
                    <option value="A+">A+</option><option value="A">A</option><option value="A-">A-</option>
                    <option value="B+">B+</option><option value="B">B</option><option value="B-">B-</option>
                    <option value="C+">C+</option><option value="C">C</option><option value="C-">C-</option>
                    <option value="D+">D+</option><option value="D">D</option><option value="D-">D-</option>
                    <option value="F">F</option>
                </select>
            </div>
            
            <button id="add-course-btn">Add course ➕</button>
            
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button id="save-sem-btn" onclick="saveAndClearSemester()" style="background-color: #07ffb5; color: black; font-weight: bold; flex: 2;">
                    Save & Add New Semester
                </button>
                <button id="reset-btn" onclick="resetCalculator()" style="background-color: #ff4d4d; color: white; font-weight: bold; flex: 1; border: none; border-radius: 5px; cursor: pointer;">
                    Reset
                </button>
            </div>
        </div>

        <div id="saved-semesters-box" style="margin: 20px 0; display: none;">
            <h3 id="saved-title">Saved Semesters</h3>
            <div id="semesters-list"></div>
        </div>

        <div id="courses-list-container">
            <div class="course-header" id="list-header">
                <div>Subject</div><div>Grade</div><div>Hours</div><div>Action</div>
            </div>
            <div id="courses-list"></div>
        </div>

        <div class="gpa-result">
            <h2 id="final-gpa-text">Final GPA</h2>
            <span id="gpa-display">0.00</span>

            <div id="chart-container" style="margin-top: 20px; display: none;">
                <canvas id="gpaChart" style="max-height: 180px;"></canvas>
            </div>

            <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                <button id="improvement-btn" onclick="handleImprovementClick()" style="padding: 10px 20px; background: linear-gradient(135deg, #00f2fe, #4facfe); color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px;">
                    🚀 خطة التحسين والمحاكاة
                </button>
                <button onclick="window.print()" style="padding: 10px 15px; background: #333; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px;">
                    🖨️ طباعة
                </button>
            </div>
            <div id="improvement-engine-box"></div>
        </div>
    </div>

    <script src="test-script.js"></script>
</body>
</html>
