<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA Calculator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #638ecb; color: #333; margin: 0; padding: 40px 10px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; background: #f5f7fa; padding: 30px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); position: relative; }
        .top-bar { display: flex; justify-content: flex-end; margin-bottom: 15px; }
        .lang-btn { background: #222; color: #fff; border: none; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: bold; }
        h1 { text-align: center; color: #007bff; font-size: 28px; margin-top: 0; margin-bottom: 25px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .input-group input, .input-group select { padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; outline: none; background: #fff; }
        .input-group input[type="text"] { flex: 3; }
        .input-group select { flex: 1; }
        .btn-add { width: 100%; padding: 12px; background: #60d394; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
        .btn-action-group { display: flex; gap: 10px; margin-bottom: 25px; }
        .btn-save { flex: 2; background: #00c9a7; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-reset { flex: 1; background: #ff5964; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .course-header, .course-row { display: flex; padding: 8px 0; align-items: center; text-align: center; }
        .course-header { font-weight: bold; color: #a0aec0; font-size: 11px; text-transform: uppercase; margin-top: 10px; }
        .course-row { border-bottom: 1px solid #edf2f7; }
        .delete-btn { background: #ff5964; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .semester-card { background: #edf2f7; padding: 15px; border-radius: 10px; margin-bottom: 12px; }
        .btn-edit-sem { background: #eab308; color: #fff; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-delete-sem { background: #ff5964; color: white; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .gpa-result { text-align: center; margin-top: 25px; background: #eef2f7; padding: 20px; border-radius: 10px; }
        .gpa-result h2 { margin: 0; color: #4a5568; font-size: 15px; }
        .gpa-result span { font-size: 32px; font-weight: bold; color: #3182ce; display: block; margin-top: 5px; }
        .btn-improvement { padding: 12px 24px; background: linear-gradient(135deg, #00f2fe, #4facfe); color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; box-shadow: 0 4px 12px rgba(79, 172, 254, 0.4); margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <button id="lang-btn" class="lang-btn" onclick="toggleLanguage()">العربية</button>
    </div>

    <h1>GPA Calculator</h1>

    <div class="input-group">
        <input type="text" id="subject" list="subjects-list" placeholder="Subject Name" autocomplete="off">
        <datalist id="subjects-list"></datalist>
        <select id="grade">
            <option value="A+">A+</option>
            <option value="A">A</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B">B</option>
            <option value="B-">B-</option>
            <option value="C+">C+</option>
            <option value="C">C</option>
            <option value="C-">C-</option>
            <option value="D+">D+</option>
            <option value="D">D</option>
            <option value="D-">D-</option>
            <option value="F">F</option>
        </select>
    </div>

    <button id="add-course-btn" class="btn-add">Add course ➕</button>

    <div class="btn-action-group">
        <button id="save-sem-btn" class="btn-save" onclick="saveAndClearSemester()">Save & Add New Semester</button>
        <button class="btn-reset" onclick="resetCalculator()">Reset</button>
    </div>

    <div id="saved-semesters-box" style="display: none;">
        <h3 style="text-align: center; color: #2d3748; font-size: 16px;">Saved Semesters</h3>
        <div id="semesters-list"></div>
    </div>

    <div class="course-header">
        <div style="flex:1;">SUBJECT</div>
        <div style="flex:1;">GRADE</div>
        <div style="flex:1;">HOURS</div>
        <div style="flex:0.5;">ACTION</div>
    </div>
    <div id="courses-list"></div>

    <div class="gpa-result">
        <h2>Final GPA</h2>
        <span id="gpa-display">0.00</span>
        
        <div>
            <button id="improvement-btn" class="btn-improvement" onclick="handleImprovementClick()">
                🚀 خطة التحسين والمحاكاة
            </button>
        </div>
        <div id="improvement-engine-box"></div>
    </div>
</div>

<script src="test-script.js"></script>
</body>
</html>
