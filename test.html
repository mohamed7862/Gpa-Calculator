<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA Calculator - Shourouk Academy</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #2b3a55; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; background: #ffffff; color: #333; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        h1 { text-align: center; color: #007bff; margin-top: 0; }
        .top-bar { display: flex; justify-content: flex-end; margin-bottom: 15px; }
        .lang-btn { background: #333; color: #fff; border: none; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .input-group input, .input-group select { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .input-group input[type="text"] { flex: 2; }
        .input-group select { flex: 1; }
        .btn-add { width: 100%; padding: 12px; background: #76ba1b; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
        .btn-action-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-save { flex: 2; background: #00c9a7; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-reset { flex: 1; background: #ff4d4d; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .course-header, .course-row { display: flex; padding: 8px 0; align-items: center; text-align: center; }
        .course-header { font-weight: bold; border-bottom: 2px solid #ddd; color: #888; font-size: 12px; }
        .course-row { border-bottom: 1px solid #eee; }
        .delete-btn { background: #ff4d4d; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .gpa-result { text-align: center; margin-top: 25px; background: #e3f2fd; padding: 15px; border-radius: 8px; }
        .gpa-result h2 { margin: 0; color: #555; font-size: 16px; }
        .gpa-result span { font-size: 32px; font-weight: bold; color: #007bff; }
        .semester-card { background: #f8f9fa; border: 1px solid #ddd; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
        .btn-edit-sem { background: #ffb703; color: #000; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-delete-sem { background: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-improvement { padding: 12px 24px; background: linear-gradient(135deg, #00f2fe, #4facfe); color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; box-shadow: 0 4px 12px rgba(79, 172, 254, 0.4); margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <button id="lang-btn" class="lang-btn" onclick="toggleLanguage()">العربية</button>
    </div>

    <h1>GPA Calculator</h1>

    <!-- خانة الإدخال مع الـ datalist -->
    <div class="input-group">
        <input type="text" id="subject" list="subjects-list" placeholder="Subject Name (Type to search)" autocomplete="off">
        <datalist id="subjects-list"></datalist>
        <select id="grade">
            <option value="A+">A+</option>
            <option value="A">A</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B">B</option>
            <option value="B-">B-</option>
            <option value="C+">C+</option>
            <option value="C">C</option>
            <option value="C-">C-</option>
            <option value="D+">D+</option>
            <option value="D">D</option>
            <option value="D-">D-</option>
            <option value="F">F</option>
        </select>
    </div>

    <button id="add-course-btn" class="btn-add">Add course ➕</button>

    <div class="btn-action-group">
        <button id="save-sem-btn" class="btn-save" onclick="saveAndClearSemester()">Save & Update Semester</button>
        <button class="btn-reset" onclick="resetCalculator()">Reset</button>
    </div>

    <!-- قائمة الترمات المحفوظة -->
    <div id="saved-semesters-box" style="display: none;">
        <h3>Saved Semesters</h3>
        <div id="semesters-list"></div>
    </div>

    <!-- جدول المواد الحالية -->
    <div class="course-header">
        <div style="flex:1;">SUBJECT</div>
        <div style="flex:1;">GRADE</div>
        <div style="flex:1;">HOURS</div>
        <div style="flex:0.5;">ACTION</div>
    </div>
    <div id="courses-list"></div>

    <!-- النتيجة والـ GPA -->
    <div class="gpa-result">
        <h2>Final GPA</h2>
        <span id="gpa-display">0.00</span>
        
        <!-- زرار خطة التحسين والمحاكاة -->
        <div>
            <button id="improvement-btn" class="btn-improvement" onclick="handleImprovementClick()">
                🚀 خطة التحسين والمحاكاة
            </button>
        </div>
        <div id="improvement-engine-box"></div>
    </div>
</div>

<script src="test-script.js"></script>
</body>
</html>
