<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA Calculator & Academic Advisor</title>
    <link rel="stylesheet" href="gpa.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="dark-theme">

    <div class="container">
        <!-- زر تحويل اللغة -->
        <div style="text-align: right; margin-bottom: 10px;">
            <button onclick="toggleLanguage()" id="lang-btn" class="btn-top-lang">العربية</button>
        </div>

        <h1 id="main-title">GPA Calculator</h1>

        <!-- اختيار القسم -->
        <div class="dept-container">
            <label for="dept-select" id="dept-label">Department / القسم:</label>
            <select id="dept-select" onchange="changeDepartment(this.value)">
                <option value="CS">Computer Science</option>
                <option value="AI">Artificial Intelligence</option>
                <option value="CYBER">Cyber Security</option>
            </select>
        </div>
        
        <div id="course-form">
            <div class="form-group">
                <input type="text" id="subject" placeholder="Subject Name" list="subjects-list" required>
                <datalist id="subjects-list"></datalist>

                <select id="grade">
                    <option value="A+">A+</option><option value="A">A</option><option value="A-">A-</option>
                    <option value="B+">B+</option><option value="B">B</option><option value="B-">B-</option>
                    <option value="C+">C+</option><option value="C">C</option><option value="C-">C-</option>
                    <option value="D+">D+</option><option value="D">D</option><option value="D-">D-</option>
                    <option value="F">F</option>
                </select>
            </div>
            
            <button id="add-course-btn">Add course ➕</button>
            
            <div class="action-buttons-row">
                <button id="save-sem-btn" onclick="saveAndClearSemester()" class="btn-save">
                    Save & Add New Semester
                </button>
                <button id="reset-btn" onclick="resetCalculator()" class="btn-reset">
                    Reset
                </button>
            </div>
        </div>

        <div id="saved-semesters-box" style="display: none;">
            <h3 id="saved-title">Saved Semesters</h3>
            <div id="semesters-list"></div>
        </div>

        <div id="courses-list-container">
            <div class="course-header" id="list-header">
                <div>Subject</div><div>Grade</div><div>Hours</div><div>Action</div>
            </div>
            <div id="courses-list"></div>
        </div>

        <div class="gpa-result">
            <h2 id="final-gpa-text">Final GPA</h2>
            <span id="gpa-display">0.00</span>

            <div id="chart-container" style="display: none;">
                <canvas id="gpaChart"></canvas>
            </div>

            <div class="footer-buttons">
                <button id="improvement-btn" onclick="handleImprovementClick()" class="btn-improvement">
                    🚀 Academic Recovery & Simulator
                </button>
                <button id="print-btn" onclick="window.print()" class="btn-print">
                    🖨️️ Print
                </button>
            </div>
            <div id="improvement-engine-box"></div>
        </div>
    </div>

    <script src="test-script.js"></script>
</body>
</html>
