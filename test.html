<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA Calculator</title>
    <link rel="stylesheet" href="gpa.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="container">
        <!-- زرار اللغة صغير وشيك ومستقل فوق على اليمين -->
        <div style="display: flex; justify-content: flex-end; margin-bottom: 10px;">
            <button onclick="toggleLanguage()" id="lang-btn" style="padding: 6px 16px; background: #212529; color: white; font-size: 13px; font-weight: bold; border-radius: 20px; border: none; cursor: pointer;">العربية</button>
        </div>

        <h1 id="main-title" style="text-align: center; margin-top: 0; margin-bottom: 25px;">GPA Calculator</h1>
        
        <div id="course-form">
            <!-- قسم المادة + الاسم + التقدير كلهم مصفوفين جنب بعض في سطر واحد منظم -->
            <div class="form-group" style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;">
                <select id="dept-select" onchange="changeDepartment(this.value)" style="flex: 1.2; min-width: 140px; padding: 12px; border-radius: 8px; border: 1px solid #ccc; background: #f8f9fa; color: #333; font-weight: bold; font-size: 13.5px; outline: none; cursor: pointer;">
                    <option value="CS">💻 CS (علوم حاسب)</option>
                    <option value="AI">🤖 AI (ذكاء اصطناعي)</option>
                    <option value="CYBER">🛡️ CYBER (أمن سيبراني)</option>
                </select>

                <input type="text" id="subject" placeholder="Subject Name" list="subjects-list" required style="flex: 2; min-width: 160px;">
                
                <datalist id="subjects-list"></datalist>

                <select id="grade" style="flex: 0.8; min-width: 75px;">
                    <option value="A+">A+</option>
                    <option value="A">A</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B">B</option>
                    <option value="B-">B-</option>
                    <option value="C+">C+</option>
                    <option value="C">C</option>
                    <option value="C-">C-</option>
                    <option value="D+">D+</option>
                    <option value="D">D</option>
                    <option value="D-">D-</option>
                    <option value="F">F</option>
                </select>
            </div>
            
            <button id="add-course-btn">Add course ➕</button>
            
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button id="save-sem-btn" onclick="saveAndClearSemester()" style="background-color: #07ffb5; color: black; font-weight: bold; flex: 2;">
                    Save & Add New Semester
                </button>
                <button id="reset-btn" onclick="resetCalculator()" style="background-color: #ff4d4d; color: white; font-weight: bold; flex: 1; border: none; border-radius: 5px; cursor: pointer;">
                    Reset
                </button>
            </div>
        </div>

        <div id="saved-semesters-box" style="margin: 20px 0; display: none;">
            <h3 id="saved-title">Saved Semesters</h3>
            <div id="semesters-list"></div>
        </div>

        <div id="courses-list-container">
            <div class="course-header" id="list-header">
                <div>Subject</div><div>Grade</div><div>Hours</div><div>Action</div>
            </div>
            <div id="courses-list"></div>
        </div>

        <div class="gpa-result">
            <h2 id="final-gpa-text">Final GPA</h2>
            <span id="gpa-display">0.00</span>

            <div id="chart-container" style="margin-top: 20px; display: none;">
                <canvas id="gpaChart" style="max-height: 180px;"></canvas>
            </div>

            <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                <button id="improvement-btn" onclick="handleImprovementClick()" style="padding: 10px 20px; background: linear-gradient(135deg, #00f2fe, #4facfe); color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px;">
                    🚀 خطة التحسين والمحاكاة
                </button>
                <button onclick="window.print()" style="padding: 10px 15px; background: #333; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px;">
                    🖨️ طباعة
                </button>
            </div>
            <div id="improvement-engine-box"></div>
        </div>
    </div>

    <script src="test-script.js"></script>
</body>
</html>
