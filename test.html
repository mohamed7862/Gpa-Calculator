<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA Calculator</title>
    <!-- استدعاء ملف الـ CSS الخاص بك -->
    <link rel="stylesheet" href="gpa.css">
    <!-- مكتبة Chart.js الرسم البياني -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- مكتبة SweetAlert2 للتنبيهات الأنيقة -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        .header-top {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        .lang-btn-style {
            width: auto !important;
            padding: 6px 18px !important;
            background-color: #2d3436 !important;
            color: #ffffff !important;
            font-size: 13px !important;
            font-weight: 700 !important;
            border-radius: 20px !important;
            border: none !important;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .dept-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .dept-wrapper select {
            width: 100%;
            max-width: 320px;
            padding: 12px 15px;
            border: 2px solid #dfe6e9;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            color: #2d3436;
            background-color: #ffffff;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .dept-wrapper select:focus {
            border-color: #0984e3;
            box-shadow: 0 0 10px rgba(9, 132, 227, 0.2);
        }

        .action-buttons-flex {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }

        .action-buttons-flex button {
            margin-top: 0 !important;
        }

        .btn-save-style {
            background: linear-gradient(135deg, #00b894, #00cec9) !important;
            color: #ffffff !important;
            flex: 2;
        }

        .btn-reset-style {
            background-color: #ff7675 !important;
            color: #ffffff !important;
            flex: 1;
        }

        .btn-reset-style:hover {
            background-color: #d63031 !important;
        }

        .course-row-item {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            background-color: #ffffff;
            border: 1px solid #dfe6e9;
            border-radius: 12px;
            padding: 8px 12px;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            animation: fadeIn 0.3s ease;
        }

        .course-row-item > div {
            flex: 1;
            text-align: center;
            font-size: 15px;
            font-weight: 700;
            color: #2d3436;
        }

        .course-row-item .grade-badge {
            background-color: #e3f2fd;
            color: #0984e3;
            padding: 4px 10px;
            border-radius: 8px;
            display: inline-block;
        }

        .footer-action-btns {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .footer-action-btns button {
            width: auto !important;
            margin-top: 0 !important;
            padding: 12px 24px !important;
        }

        .btn-improvement-style {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe) !important;
            color: #ffffff !important;
        }

        .btn-print-style {
            background-color: #2d3436 !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- زر تغيير اللغة بالقمة -->
        <div class="header-top">
            <button onclick="toggleLanguage()" id="lang-btn" class="lang-btn-style">العربية</button>
        </div>

        <h1 id="main-title">GPA Calculator</h1>

        <!-- القائمة المنسدلة للقسم -->
        <div class="dept-wrapper">
            <select id="dept-select" onchange="changeDepartment(this.value)">
                <option value="CS">Computer Science</option>
                <option value="AI">Artificial Intelligence</option>
                <option value="CYBER">Cyber Security</option>
            </select>
        </div>
        
        <!-- نموذج إضافة المادة (إرجاع الـ input والـ datalist) -->
        <div id="course-form">
            <div class="form-group">
                <input type="text" id="subject" list="subjects-list" placeholder="Subject Name" style="flex: 2; font-weight: 600;" autocomplete="off">
                <datalist id="subjects-list"></datalist>

                <select id="grade" style="flex: 1;">
                    <!-- ملء التقديرات ديناميكياً -->
                </select>
            </div>
            
            <button id="add-course-btn">Add course ➕</button>
            
            <div class="action-buttons-flex">
                <button id="save-sem-btn" onclick="saveAndClearSemester()" class="btn-save-style">
                    Save & Add New Semester
                </button>
                <button id="reset-btn" onclick="resetCalculator()" class="btn-reset-style">
                    Reset
                </button>
            </div>
        </div>

        <!-- قائمة الترمات المحفوظة -->
        <div id="saved-semesters-box" style="display: none; margin-top: 25px;">
            <h3 id="saved-title" style="color: #2d3436; font-weight: 800; margin-bottom: 15px;">Saved Semesters</h3>
            <div id="semesters-list"></div>
        </div>

        <!-- جدول قائمة المواد المضافة للترم الحالي -->
        <div id="courses-list-container">
            <div class="course-header" id="list-header">
                <div>Subject</div><div>Grade</div><div>Hours</div><div>Action</div>
            </div>
            <div id="courses-list"></div>
        </div>

        <!-- النتيجة والمعدل التراكمي -->
        <div class="gpa-result">
            <h2 id="final-gpa-text">Final GPA</h2>
            <span id="gpa-display">0.00</span>

            <div id="chart-container" style="display: none; margin-top: 20px;">
                <canvas id="gpaChart"></canvas>
            </div>

            <div class="footer-action-btns">
                <button id="improvement-btn" onclick="handleImprovementClick()" class="btn-improvement-style">
                    🚀 Academic Recovery & Target Simulator
                </button>
                <button id="print-btn" onclick="window.print()" class="btn-print-style">
                    🖨️ Print
                </button>
            </div>
            <div id="improvement-engine-box"></div>
        </div>
    </div>

    <script src="test-script.js"></script>
</body>
</html>
