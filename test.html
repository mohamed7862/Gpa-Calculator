<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA Calculator - Shourouk Academy</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; margin: 0; padding: 30px 15px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 850px; background: #1e293b; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); border: 1px solid #334155; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { margin: 0; font-size: 26px; color: #38bdf8; font-weight: 700; }
        .lang-btn { background: #334155; color: #f8fafc; border: 1px solid #475569; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .lang-btn:hover { background: #475569; }
        
        .input-group { display: flex; gap: 12px; margin-bottom: 15px; }
        .input-group input, .input-group select { padding: 12px 16px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 10px; font-size: 15px; outline: none; transition: 0.2s; }
        .input-group input:focus, .input-group select:focus { border-color: #38bdf8; }
        .input-group input[type="text"] { flex: 3; }
        .input-group select { flex: 1; cursor: pointer; }

        .btn-add { width: 100%; padding: 14px; background: #22c55e; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 20px; transition: 0.2s; }
        .btn-add:hover { background: #16a34a; }

        .btn-action-group { display: flex; gap: 12px; margin-bottom: 25px; }
        .btn-save { flex: 2; background: #0284c7; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-save:hover { background: #0369a1; }
        .btn-reset { flex: 1; background: #ef4444; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-reset:hover { background: #dc2626; }

        .course-header { display: flex; padding: 12px; background: #334155; border-radius: 8px; font-weight: bold; color: #94a3b8; font-size: 13px; text-transform: uppercase; margin-top: 15px; }
        .course-row { display: flex; padding: 12px; border-bottom: 1px solid #334155; align-items: center; text-align: center; }
        .delete-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        .semester-card { background: #0f172a; border: 1px solid #334155; padding: 16px; border-radius: 12px; margin-bottom: 12px; }
        .btn-edit-sem { background: #f59e0b; color: #000; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-delete-sem { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        .gpa-result { text-align: center; margin-top: 30px; background: #0f172a; padding: 25px; border-radius: 14px; border: 1px solid #334155; }
        .gpa-result h2 { margin: 0 0 8px 0; color: #94a3b8; font-size: 16px; font-weight: 600; }
        .gpa-result span { font-size: 38px; font-weight: 800; color: #38bdf8; display: block; margin-bottom: 15px; }

        /* زرار التحسين الشيك والواضح */
        .btn-improvement { width: 100%; max-width: 320px; padding: 14px 20px; background: linear-gradient(135deg, #06b6d4, #3b82f6); color: #ffffff; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 16px; box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3); transition: 0.2s; margin-top: 10px; }
        .btn-improvement:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(6, 182, 212, 0.4); }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <h1>GPA Calculator</h1>
        <button id="lang-btn" class="lang-btn" onclick="toggleLanguage()">العربية</button>
    </div>

    <!-- الإدخال -->
    <div class="input-group">
        <input type="text" id="subject" list="subjects-list" placeholder="Subject Name (Type to search)" autocomplete="off">
        <datalist id="subjects-list"></datalist>
        <select id="grade">
            <option value="A+">A+</option>
            <option value="A">A</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B">B</option>
            <option value="B-">B-</option>
            <option value="C+">C+</option>
            <option value="C">C</option>
            <option value="C-">C-</option>
            <option value="D+">D+</option>
            <option value="D">D</option>
            <option value="D-">D-</option>
            <option value="F">F</option>
        </select>
    </div>

    <button id="add-course-btn" class="btn-add">Add course ➕</button>

    <div class="btn-action-group">
        <button id="save-sem-btn" class="btn-save" onclick="saveAndClearSemester()">Save & Update Semester</button>
        <button class="btn-reset" onclick="resetCalculator()">Reset</button>
    </div>

    <!-- الترمات المحفوظة -->
    <div id="saved-semesters-box" style="display: none; margin-bottom: 25px;">
        <h3 style="color: #38bdf8; font-size: 18px; margin-bottom: 12px;">Saved Semesters</h3>
        <div id="semesters-list"></div>
    </div>

    <!-- جدول المواد -->
    <div class="course-header">
        <div style="flex:1; text-align: left;">SUBJECT</div>
        <div style="flex:1; text-align: center;">GRADE</div>
        <div style="flex:1; text-align: center;">HOURS</div>
        <div style="flex:0.5; text-align: center;">ACTION</div>
    </div>
    <div id="courses-list"></div>

    <!-- عرض المعدل التراكمي وزرار المحاكاة -->
    <div class="gpa-result">
        <h2>Final GPA</h2>
        <span id="gpa-display">0.00</span>
        
        <div>
            <button id="improvement-btn" class="btn-improvement" onclick="handleImprovementClick()">
                🚀 خطة التحسين والمحاكاة
            </button>
        </div>
        <div id="improvement-engine-box"></div>
    </div>
</div>

<script src="test-script.js"></script>
</body>
</html>
